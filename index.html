<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recruiter Workspace</title>

  <!-- Vanilla CSS (no frameworks) -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- Alpine.js: single lightweight dependency, loaded as a deferred script.
       Our app modules register their stores/components before Alpine boots. -->
  <script defer src="vendor/alpine.min.js"></script>

  <!-- Application entry point (ES module). Modules run before deferred
       classic scripts, so all state stores are registered in time. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" x-data="appShell()" class="app-shell">

    <!-- ============ Sidebar / primary navigation ============ -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-name">Recruiter Workspace</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <template x-for="item in navItems" :key="item.id">
          <button
            type="button"
            class="nav-item"
            :class="{ 'is-active': currentView === item.id }"
            :aria-current="currentView === item.id ? 'page' : undefined"
            @click="navigate(item.id)"
            x-text="item.label">
          </button>
        </template>
      </nav>

      <div class="sidebar-footer">
        <small>Foundation shell — placeholder content only</small>
      </div>
    </aside>

    <!-- ============ Main content area ============ -->
    <main class="main">
      <header class="topbar">
        <h1 class="topbar-title" x-text="currentTitle"></h1>
        <span class="topbar-status" x-show="saveStatus" x-text="saveStatus"></span>
      </header>

      <section class="content">

        <!-- Dashboard -->
        <div x-show="currentView === 'dashboard'" hidden>
          <div id="view-dashboard"></div>
        </div>

        <!-- Jobs -->
        <div x-show="currentView === 'jobs'" hidden>
          <div id="view-jobs"></div>
        </div>

        <!-- Create Job -->
        <div x-show="currentView === 'create-job'" hidden>
          <div id="view-create-job"></div>
        </div>

        <!-- Job Workspace -->
        <div x-show="currentView === 'job-workspace'" hidden>
          <div id="view-job-workspace"></div>
        </div>

        <!-- Candidate Workspace -->
        <div x-show="currentView === 'candidate-workspace'" hidden>
          <div id="view-candidate-workspace"></div>
        </div>

        <!-- Talent Pool -->
        <div x-show="currentView === 'talent-pool'" hidden>
          <div id="view-talent-pool"></div>
        </div>

        <!-- Follow-ups -->
        <div x-show="currentView === 'follow-ups'" hidden>
          <div id="view-follow-ups"></div>
        </div>

        <!-- Quick Copy -->
        <div x-show="currentView === 'quick-copy'" hidden>
          <div id="view-quick-copy"></div>
        </div>

        <!-- Master Templates -->
        <div x-show="currentView === 'master-templates'" hidden>
          <div id="view-master-templates"></div>
        </div>

      </section>
    </main>
  </div>

  <!-- Alpine.js component registry hook: js/app.js fills these containers
       with placeholder views and registers Alpine components/stores. -->
</body>
</html>
